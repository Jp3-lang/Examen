<!DOCTYPE html>

<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Panel de Administrador - Examen de Ingreso</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    .contenedor {
      max-width: 1000px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #333;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #panel {
      display: none;
    }

    #mensaje {
      text-align: center;
      margin-top: 15px;
      color: red;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }

    th {
      background: #f0f0f0;
    }

    .cerrar {
      background: #dc2626;
    }

    .cerrar:hover {
      background: #b91c1c;
    }

    @media (max-width: 700px) {

      .contenedor {
        padding: 15px;
      }

      table {
        font-size: 12px;
      }

      th, td {
        padding: 6px;
      }

    }
  </style>

</head>

<body>

<div class="contenedor">

  <!-- LOGIN -->

  <div id="login">

```
<h1>Panel de Administrador</h1>

<p style="text-align:center;">
  Inicia sesión con tu cuenta de Google
</p>

<button id="btnGoogle">
  🔐 Acceder con Google
</button>

<p id="mensaje"></p>
```

  </div>

  <!-- PANEL -->

  <div id="panel">

```
<h1>Resultados del Examen de Ingreso</h1>

<p id="usuario"></p>

<button
  class="cerrar"
  id="btnCerrar">
  Cerrar sesión
</button>

<button id="btnActualizar">
  Actualizar resultados
</button>

<div id="resultados">
  Cargando resultados...
</div>
```

  </div>

</div>

<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


  import {
    getFirestore,
    collection,
    getDocs
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


  // =========================================
  // CONFIGURACIÓN DE FIREBASE
  // =========================================

   const firebaseConfig = {
    apiKey: "AIzaSyAxv_ZFMYvbwHWtQhLYf7ZlhnyyOFOB05w",
    authDomain: "examen-11a7c.firebaseapp.com",
    projectId: "examen-11a7c",
    storageBucket: "examen-11a7c.firebasestorage.app",
    messagingSenderId: "1075495431638",
    appId: "1:1075495431638:web:341f1cb00f5df4ec520877"
  };


  // =========================================
  // INICIALIZAR FIREBASE
  // =========================================

  const app =
    initializeApp(firebaseConfig);


  const db =
    getFirestore(app);


  const auth =
    getAuth(app);


  const provider =
    new GoogleAuthProvider();


  // =========================================
  // ELEMENTOS DE LA PÁGINA
  // =========================================

  const login =
    document.getElementById("login");

  const panel =
    document.getElementById("panel");

  const mensaje =
    document.getElementById("mensaje");

  const usuario =
    document.getElementById("usuario");

  const resultados =
    document.getElementById("resultados");


  // =========================================
  // INICIAR SESIÓN CON GOOGLE
  // =========================================

  document
    .getElementById("btnGoogle")
    .addEventListener("click", async () => {

      mensaje.textContent =
        "Iniciando sesión...";

      try {

        await signInWithPopup(
          auth,
          provider
        );

      } catch (error) {

        console.error(
          "Error al iniciar sesión:",
          error
        );

        mensaje.textContent =
          "No se pudo iniciar sesión.";

      }

    });


  // =========================================
  // COMPROBAR USUARIO
  // =========================================

  onAuthStateChanged(
    auth,
    async (user) => {

      if (user) {

        login.style.display =
          "none";

        panel.style.display =
          "block";


        usuario.textContent =
          "Administrador: " +
          user.email;


        await cargarResultados();


      } else {

        login.style.display =
          "block";

        panel.style.display =
          "none";

      }

    }
  );


  // =========================================
  // CERRAR SESIÓN
  // =========================================

  document
    .getElementById("btnCerrar")
    .addEventListener("click", async () => {

      await signOut(auth);

    });


  // =========================================
  // ACTUALIZAR RESULTADOS
  // =========================================

  document
    .getElementById("btnActualizar")
    .addEventListener(
      "click",
      cargarResultados
    );


  // =========================================
  // CARGAR RESULTADOS
  // =========================================

  async function cargarResultados() {

    resultados.innerHTML =
      "Cargando resultados...";


    try {

      const consulta =
        await getDocs(
          collection(
            db,
            "resultados"
          )
        );


      if (consulta.empty) {

        resultados.innerHTML =
          "<p>No hay resultados todavía.</p>";

        return;

      }


      let html = `

        <table>

          <tr>

            <th>Alumno</th>

            <th>Matemáticas</th>

            <th>Español</th>

            <th>Promedio</th>

          </tr>

      `;


      consulta.forEach(
        (documento) => {

          const datos =
            documento.data();


          const matematicas =
            datos.matematicas || 0;


          const totalMatematicas =
            datos.totalMatematicas || 0;


          const espanol =
            datos.espanol || 0;


          const totalEspanol =
            datos.totalEspanol || 0;


          const porcentajeMatematicas =
            totalMatematicas > 0
            ? (
                matematicas /
                totalMatematicas
              ) * 100
            : 0;


          const porcentajeEspanol =
            totalEspanol > 0
            ? (
                espanol /
                totalEspanol
              ) * 100
            : 0;


          const promedio =
            (
              porcentajeMatematicas +
              porcentajeEspanol
            ) / 2;


          html += `

            <tr>

              <td>
                ${
                  datos.nombre ||
                  "Sin nombre"
                }
              </td>

              <td>
                ${matematicas}/
                ${totalMatematicas}
                <br>
                (${porcentajeMatematicas.toFixed(0)}%)
              </td>

              <td>
                ${espanol}/
                ${totalEspanol}
                <br>
                (${porcentajeEspanol.toFixed(0)}%)
              </td>

              <td>
                ${promedio.toFixed(0)}%
              </td>

            </tr>

          `;

        }
      );


      html +=
        "</table>";


      resultados.innerHTML =
        html;


    } catch (error) {

      console.error(
        "Error al cargar resultados:",
        error
      );


      resultados.innerHTML =
        "<p>No se pudieron cargar los resultados.</p>";

    }

  }

</script>

</body>
</html>
