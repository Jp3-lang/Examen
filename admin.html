<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Administrador - Examen de Ingreso</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:20px}
.contenedor{max-width:1000px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.1)}
h1{text-align:center;color:#333}button{width:100%;padding:12px;margin-top:10px;border:0;border-radius:6px;background:#2563eb;color:#fff;font-size:16px;cursor:pointer}
button:hover{background:#1d4ed8}.cerrar{background:#dc2626}.cerrar:hover{background:#b91c1c}
#panel{display:none}#mensaje{text-align:center;margin-top:15px;color:red}table{width:100%;border-collapse:collapse;margin-top:20px}
th,td{border:1px solid #ddd;padding:10px;text-align:center;vertical-align:middle}th{background:#f0f0f0}
.estadoDisponible{color:#15803d;font-weight:bold}.estadoUtilizado{color:#b91c1c;font-weight:bold}
.detalle{margin-top:20px;padding:20px;border:1px solid #ddd;border-radius:8px;background:#fafafa}
.correcta{border-left:6px solid #16a34a;padding:12px;margin:10px 0;background:#f0fdf4}
.incorrecta{border-left:6px solid #dc2626;padding:12px;margin:10px 0;background:#fef2f2}
.sinResponder{border-left:6px solid #ca8a04;padding:12px;margin:10px 0;background:#fffbeb}
.opciones{margin-top:8px;padding-left:20px}.opciones li{margin:4px 0}
.cerrarDetalle{background:#64748b}
@media(max-width:700px){.contenedor{padding:15px}table{font-size:12px}th,td{padding:6px}}
</style>
</head>
<body>
<div class="contenedor">
  <div id="login">
    <h1>Panel de Administrador</h1>
    <p style="text-align:center;">Inicia sesión con tu cuenta de Google</p>
    <button id="btnGoogle">🔐 Acceder con Google</button>
    <p id="mensaje"></p>
  </div>

  <div id="panel">
    <h1>Resultados del Examen de Ingreso</h1>
    <p id="usuario"></p>
    <button class="cerrar" id="btnCerrar">Cerrar sesión</button>
    <button id="btnActualizar">Actualizar resultados</button>

    <h2>Crear accesos para alumnos</h2>
    <button id="btnCrearAcceso">Crear nuevo enlace</button>
    <div id="accesos"></div>

    <div id="resultados">Cargando resultados...</div>
    <div id="detalleRespuestas"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
  getFirestore, collection, getDocs, doc, setDoc, serverTimestamp, query, orderBy
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const firebaseConfig={
  apiKey:"AIzaSyAxv_ZFMYvbwHWtQhLYf7ZlhnyyOFOB05w",
  authDomain:"examen-11a7c.firebaseapp.com",
  projectId:"examen-11a7c",
  storageBucket:"examen-11a7c.firebasestorage.app",
  messagingSenderId:"1075495431638",
  appId:"1:1075495431638:web:341f1cb00f5df4ec520877"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);
const provider=new GoogleAuthProvider();

const login=document.getElementById("login");
const panel=document.getElementById("panel");
const mensaje=document.getElementById("mensaje");
const usuario=document.getElementById("usuario");
const resultados=document.getElementById("resultados");
const accesos=document.getElementById("accesos");
const detalle=document.getElementById("detalleRespuestas");

document.getElementById("btnGoogle").addEventListener("click",async()=>{
  mensaje.textContent="Iniciando sesión...";
  try{await signInWithPopup(auth,provider)}
  catch(error){console.error(error);mensaje.textContent="No se pudo iniciar sesión."}
});

onAuthStateChanged(auth,async user=>{
  if(user){
    login.style.display="none";
    panel.style.display="block";
    usuario.textContent="Administrador: "+user.email;
    await cargarResultados();
    await cargarAccesos();
  }else{
    login.style.display="block";
    panel.style.display="none";
  }
});

document.getElementById("btnCerrar").addEventListener("click",()=>signOut(auth));
document.getElementById("btnActualizar").addEventListener("click",async()=>{
  detalle.innerHTML="";
  await cargarResultados();
  await cargarAccesos();
});
document.getElementById("btnCrearAcceso").addEventListener("click",crearAcceso);

function generarCodigo(){
  const caracteres="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";
  let codigo="";
  for(let i=0;i<12;i++) codigo+=caracteres[Math.floor(Math.random()*caracteres.length)];
  return codigo;
}

async function crearAcceso(){
  const boton=document.getElementById("btnCrearAcceso");
  boton.disabled=true;
  try{
    let codigo=generarCodigo();
    let referencia=doc(db,"intentos",codigo);
    const existente=await getDocs(collection(db,"intentos"));
    const codigosExistentes=new Set(existente.docs.map(d=>d.id));
    while(codigosExistentes.has(codigo)){
      codigo=generarCodigo();
      referencia=doc(db,"intentos",codigo);
    }
    await setDoc(referencia,{usado:false,createdAt:serverTimestamp()});
    await cargarAccesos();
  }catch(error){
    console.error(error);
    alert("No se pudo crear el enlace.");
  }finally{
    boton.disabled=false;
  }
}

async function cargarAccesos(){
  accesos.innerHTML="Cargando accesos...";
  try{
    const consulta=await getDocs(collection(db,"intentos"));
    if(consulta.empty){
      accesos.innerHTML="<p>No hay accesos creados todavía.</p>";
      return;
    }

    const base=new URL("index.html",window.location.href).href;
    let html=`<table><tr><th>Enlace</th><th>Estado</th></tr>`;

    consulta.forEach(d=>{
      const datos=d.data();
      const url=new URL(base);
      url.searchParams.set("codigo",d.id);
      const estado=datos.usado===true
        ? `<span class="estadoUtilizado">Utilizado</span>`
        : `<span class="estadoDisponible">Disponible</span>`;
      html+=`<tr>
        <td><a href="${url.href}" target="_blank" rel="noopener">${url.href}</a></td>
        <td>${estado}</td>
      </tr>`;
    });

    html+="</table>";
    accesos.innerHTML=html;
  }catch(error){
    console.error(error);
    accesos.innerHTML="<p>No se pudieron cargar los accesos.</p>";
  }
}

function escapar(text){
  return String(text??"").replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}

async function cargarResultados(){
  resultados.innerHTML="Cargando resultados...";
  detalle.innerHTML="";
  try{
    const consulta=await getDocs(collection(db,"resultados"));
    if(consulta.empty){
      resultados.innerHTML="<p>No hay resultados todavía.</p>";
      return;
    }

    let html=`<h2>Resultados</h2>
      <table><tr>
      <th>Alumno</th><th>Matemáticas</th><th>Español</th><th>Promedio</th><th>Detalle</th>
      </tr>`;

    consulta.forEach(documento=>{
      const datos=documento.data();
      const matematicas=datos.matematicas||0;
      const totalMatematicas=datos.totalMatematicas||0;
      const espanol=datos.espanol||0;
      const totalEspanol=datos.totalEspanol||0;
      const porcentajeMatematicas=totalMatematicas?(matematicas/totalMatematicas)*100:0;
      const porcentajeEspanol=totalEspanol?(espanol/totalEspanol)*100:0;
      const promedio=(porcentajeMatematicas+porcentajeEspanol)/2;

      html+=`<tr>
        <td>${escapar(datos.nombre||"Sin nombre")}</td>
        <td>${matematicas}/${totalMatematicas}<br>(${porcentajeMatematicas.toFixed(0)}%)</td>
        <td>${espanol}/${totalEspanol}<br>(${porcentajeEspanol.toFixed(0)}%)</td>
        <td>${promedio.toFixed(0)}%</td>
        <td><button onclick="verRespuestas('${documento.id}')">Ver respuestas</button></td>
      </tr>`;
    });

    html+="</table>";
    resultados.innerHTML=html;

    window._resultadosCache={};
    consulta.forEach(d=>window._resultadosCache[d.id]=d.data());

  }catch(error){
    console.error(error);
    resultados.innerHTML="<p>No se pudieron cargar los resultados.</p>";
  }
}

window.verRespuestas=function(id){
  const datos=window._resultadosCache?.[id];
  if(!datos){alert("No se encontró el resultado.");return;}

  const pm=Array.isArray(datos.preguntasMatematicas)?datos.preguntasMatematicas:[];
  const pe=Array.isArray(datos.preguntasEspanol)?datos.preguntasEspanol:[];
  const rm=datos.respuestasMatematicas||{};
  const re=datos.respuestasEspanol||{};

  let html=`<div class="detalle">
    <h2>Respuestas de ${escapar(datos.nombre||"Sin nombre")}</h2>
    <p><strong>Matemáticas:</strong> ${datos.matematicas||0}/${datos.totalMatematicas||pm.length}</p>`;

  html+=generarDetalleMateria("Matemáticas",pm,rm);
  html+=`<p><strong>Español:</strong> ${datos.espanol||0}/${datos.totalEspanol||pe.length}</p>`;
  html+=generarDetalleMateria("Español",pe,re);

  html+=`<button class="cerrarDetalle" onclick="document.getElementById('detalleRespuestas').innerHTML=''">Cerrar detalle</button></div>`;
  detalle.innerHTML=html;
  detalle.scrollIntoView({behavior:"smooth",block:"start"});
};

function generarDetalleMateria(nombre,preguntas,respuestas){
  if(!preguntas.length){
    return `<p class="nota">Este resultado fue creado antes de guardar las preguntas exactas del examen, por lo que no es posible mostrar el detalle de ${nombre} correctamente.</p>`;
  }

  let html=`<h3>${nombre}</h3>`;
  preguntas.forEach((p,i)=>{
    const seleccion=respuestas[i];
    const correcta=p.correcta;
    const sinResponder=seleccion===undefined||seleccion===null;
    const esCorrecta=!sinResponder && Number(seleccion)===Number(correcta);
    const clase=sinResponder?"sinResponder":(esCorrecta?"correcta":"incorrecta");
    const titulo=sinResponder?"⚠️ Sin responder":(esCorrecta?"✅ Correcta":"❌ Incorrecta");

    const respuestaAlumno=sinResponder?"Sin respuesta":(p.opciones?.[Number(seleccion)]??"Respuesta no encontrada");
    const respuestaCorrecta=(typeof correcta==="number")
      ? (p.opciones?.[Number(correcta)]??String(correcta))
      : String(correcta);

    html+=`<div class="${clase}">
      <strong>${i+1}. ${escapar(p.pregunta)}</strong>
      <p><strong>${titulo}</strong></p>
      <p>Respuesta del alumno: <strong>${escapar(respuestaAlumno)}</strong></p>
      <p>Respuesta correcta: <strong>${escapar(respuestaCorrecta)}</strong></p>
      <details><summary>Ver opciones</summary><ol class="opciones">`;

    (p.opciones||[]).forEach((op,j)=>{
      html+=`<li>${escapar(op)}${Number(correcta)===j?" ← correcta":""}</li>`;
    });

    html+=`</ol></details></div>`;
  });
  return html;
}
</script>
</body>
</html>
