<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Administrador - Examen</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#222}.contenedor{width:92%;max-width:950px;margin:30px auto;background:#fff;padding:25px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.1)}h1{text-align:center}.fila{display:flex;gap:10px;flex-wrap:wrap}.fila input{flex:1;min-width:220px;padding:12px;border:1px solid #ccc;border-radius:6px}button{padding:12px 16px;border:0;border-radius:6px;background:#2563eb;color:white;cursor:pointer}button:hover{background:#1d4ed8}.tarjeta{border:1px solid #ddd;border-radius:8px;padding:15px;margin:12px 0}.disponible{color:#166534;font-weight:bold}.utilizado{color:#991b1b;font-weight:bold}.enlace{word-break:break-all;background:#f8fafc;padding:10px;border-radius:6px;margin-top:8px}.oculto{display:none}.error{color:#b91c1c;font-weight:bold}.nota{background:#fff7ed;padding:12px;border-radius:8px;margin:15px 0}.login{max-width:500px;margin:auto}.login input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:6px}</style></head><body><div class="contenedor">
<div id="login" class="login"><h1>Panel de administrador</h1><p>Introduce la contraseña del panel.</p><input id="pass" type="password" placeholder="Contraseña"><button onclick="entrar()">Entrar</button><p id="loginError" class="error"></p></div>
<div id="panel" class="oculto"><h1>Enlaces de examen</h1><div class="nota">Desde aquí puedes crear nuevos accesos. Cada enlace se guarda en Firestore y queda inutilizable después de iniciar un examen.</div><div class="fila"><input id="cantidad" type="number" min="1" max="50" value="1"><button onclick="crearEnlaces()">Crear nuevos enlaces</button><button onclick="cargarAccesos()">Actualizar</button></div><p id="mensaje"></p><h2>Accesos</h2><div id="lista">Cargando...</div></div></div>
<script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";import{getFirestore,collection,doc,setDoc,getDocs,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";const firebaseConfig={apiKey:"AIzaSyAxv_ZFMYvbwHWtQhLYf7ZlhnyyOFOB05w",authDomain:"examen-11a7c.firebaseapp.com",projectId:"examen-11a7c",storageBucket:"examen-11a7c.firebasestorage.app",messagingSenderId:"1075495431638",appId:"1:1075495431638:web:341f1cb00f5df4ec520877"};const app=initializeApp(firebaseConfig),db=getFirestore(app);const BASE_URL=location.origin+location.pathname.replace(/admin\.html$/,'index.html');const ADMIN_PASSWORD='admin2026';function entrar(){if(document.getElementById('pass').value===ADMIN_PASSWORD){sessionStorage.setItem('admin_ok','1');mostrarPanel();}else document.getElementById('loginError').textContent='Contraseña incorrecta.';}function mostrarPanel(){document.getElementById('login').classList.add('oculto');document.getElementById('panel').classList.remove('oculto');cargarAccesos();}function generarToken(){const a=new Uint8Array(12);crypto.getRandomValues(a);return Array.from(a,b=>b.toString(16).padStart(2,'0')).join('');}window.crearEnlaces=async function(){const n=Math.max(1,Math.min(50,parseInt(document.getElementById('cantidad').value)||1));const msg=document.getElementById('mensaje');msg.textContent='Creando...';try{for(let i=0;i<n;i++){const id=generarToken();await setDoc(doc(db,'accesos',id),{estado:'disponible',fechaCreacion:serverTimestamp()});}msg.textContent=`Se crearon ${n} enlace(s).`;await cargarAccesos();}catch(e){console.error(e);msg.textContent='No se pudieron crear los enlaces.';msg.className='error';}};window.cargarAccesos=async function(){const lista=document.getElementById('lista');lista.textContent='Cargando...';try{const snap=await getDocs(collection(db,'accesos'));const datos=[];snap.forEach(d=>datos.push({id:d.id,...d.data()}));datos.sort((a,b)=>{const ta=a.fechaCreacion?.seconds||0,tb=b.fechaCreacion?.seconds||0;return tb-ta;});if(!datos.length){lista.innerHTML='<p>No hay enlaces creados todavía.</p>';return;}lista.innerHTML='';datos.forEach(d=>{const url=`${BASE_URL}?acceso=${encodeURIComponent(d.id)}`;const usado=d.estado==='utilizado';const div=document.createElement('div');div.className='tarjeta';div.innerHTML=`<div><strong>Estado:</strong> <span class="${usado?'utilizado':'disponible'}">${usado?'UTILIZADO':'DISPONIBLE'}</span></div><div><strong>Código:</strong> ${d.id}</div><div class="enlace">${url}</div><button style="margin-top:8px" onclick="navigator.clipboard.writeText(${JSON.stringify(url)}).then(()=>alert('Enlace copiado'))">Copiar enlace</button>`;lista.appendChild(div);});}catch(e){console.error(e);lista.innerHTML='<p class="error">No se pudieron cargar los accesos.</p>';}};if(sessionStorage.getItem('admin_ok')==='1')mostrarPanel();</script></body></html>
