<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Administrador - Examen de Ingreso</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:20px}
.contenedor{max-width:1000px;margin:40px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.1)}
h1{text-align:center;color:#333}button{width:100%;padding:12px;margin-top:10px;border:0;border-radius:6px;background:#2563eb;color:#fff;font-size:16px;cursor:pointer}
button:hover{background:#1d4ed8}.cerrar{background:#dc2626}.cerrar:hover{background:#b91c1c}
#panel{display:none}#mensaje{text-align:center;margin-top:15px;color:red}table{width:100%;border-collapse:collapse;margin-top:20px}
th,td{border:1px solid #ddd;padding:10px;text-align:center}th{background:#f0f0f0}
.detalle{display:none;background:#fafafa}.detalle td{text-align:left}.ver{width:auto;margin:0;padding:7px 12px;font-size:14px}.correcta{background:#dcfce7}.incorrecta{background:#fee2e2}.sinrespuesta{background:#fef3c7}
@media(max-width:700px){.contenedor{padding:15px}table{font-size:12px}th,td{padding:6px}}
</style>
</head>
<body>
<div class="contenedor">
  <div id="login">
    <h1>Panel de Administrador</h1>
    <p style="text-align:center;">Inicia sesión con tu cuenta de Google</p>
    <button id="btnGoogle">🔐 Acceder con Google</button>
    <p id="mensaje"></p>
  </div>
  <div id="panel">
    <h1>Resultados del Examen de Ingreso</h1>
    <p id="usuario"></p>
    <button class="cerrar" id="btnCerrar">Cerrar sesión</button>
    <button id="btnActualizar">Actualizar resultados</button>
    <div id="resultados">Cargando resultados...</div>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAxv_ZFMYvbwHWtQhLYf7ZlhnyyOFOB05w",
  authDomain: "examen-11a7c.firebaseapp.com",
  projectId: "examen-11a7c",
  storageBucket: "examen-11a7c.firebasestorage.app",
  messagingSenderId: "1075495431638",
  appId: "1:1075495431638:web:341f1cb00f5df4ec520877"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);
const provider=new GoogleAuthProvider();

const login=document.getElementById("login");
const panel=document.getElementById("panel");
const mensaje=document.getElementById("mensaje");
const usuario=document.getElementById("usuario");
const resultados=document.getElementById("resultados");

document.getElementById("btnGoogle").addEventListener("click",async()=>{
  mensaje.textContent="Iniciando sesión...";
  try{await signInWithPopup(auth,provider)}
  catch(error){console.error(error);mensaje.textContent="No se pudo iniciar sesión."}
});

onAuthStateChanged(auth,async user=>{
  if(user){
    login.style.display="none";
    panel.style.display="block";
    usuario.textContent="Administrador: "+user.email;
    await cargarResultados();
  }else{
    login.style.display="block";
    panel.style.display="none";
  }
});

document.getElementById("btnCerrar").addEventListener("click",()=>signOut(auth));
document.getElementById("btnActualizar").addEventListener("click",cargarResultados);

async function cargarResultados(){
  resultados.innerHTML="Cargando resultados...";
  try{
    const consulta=await getDocs(collection(db,"resultados"));
    if(consulta.empty){resultados.innerHTML="<p>No hay resultados todavía.</p>";return}
    let html=`<table><tr><th>Alumno</th><th>Matemáticas</th><th>Español</th><th>Promedio</th><th>Detalle</th></tr>`;
    consulta.forEach(documento=>{
      const datos=documento.data();
      const matematicas=datos.matematicas||0;
      const totalMatematicas=datos.totalMatematicas||0;
      const espanol=datos.espanol||0;
      const totalEspanol=datos.totalEspanol||0;
      const porcentajeMatematicas=totalMatematicas?(matematicas/totalMatematicas)*100:0;
      const porcentajeEspanol=totalEspanol?(espanol/totalEspanol)*100:0;
      const promedio=(porcentajeMatematicas+porcentajeEspanol)/2;
      const id=documento.id;
      html+=`<tr><td>${escapar(datos.nombre||"Sin nombre")}</td><td>${matematicas}/${totalMatematicas}<br>(${porcentajeMatematicas.toFixed(0)}%)</td><td>${espanol}/${totalEspanol}<br>(${porcentajeEspanol.toFixed(0)}%)</td><td>${promedio.toFixed(0)}%</td><td><button class="ver" onclick="verRespuestas('${id}')">Ver respuestas</button></td></tr>`;
      html+=`<tr id="detalle-${id}" class="detalle"><td colspan="5"><div id="contenido-${id}">Cargando...</div></td></tr>`;
    });
    html+="</table>";
    resultados.innerHTML=html;
  }catch(error){
    console.error(error);
    resultados.innerHTML="<p>No se pudieron cargar los resultados.</p>";
  }
}
let bancoMatematicas=[];
let bancoEspanol=[];

async function cargarBancos(){
  if(bancoMatematicas.length && bancoEspanol.length) return;
  const [m,e]=await Promise.all([fetch("matematicas.json"),fetch("espanol.json")]);
  if(!m.ok || !e.ok) throw new Error("No se pudieron cargar los JSON");
  bancoMatematicas=await m.json();
  bancoEspanol=await e.json();
}

window.verRespuestas=async function(id){
  const fila=document.getElementById("detalle-"+id);
  const cont=document.getElementById("contenido-"+id);
  if(fila.style.display==="table-row"){fila.style.display="none";return}
  fila.style.display="table-row";
  cont.innerHTML="Cargando respuestas...";
  try{
    await cargarBancos();
    const snap=await getDocs(collection(db,"resultados"));
    const doc=snap.docs.find(d=>d.id===id);
    if(!doc){cont.innerHTML="No se encontró el resultado.";return}
    const datos=doc.data();
    cont.innerHTML=detalleMateria("Matemáticas",bancoMatematicas,datos.respuestasMatematicas||{})+
                   detalleMateria("Español",bancoEspanol,datos.respuestasEspanol||{});
  }catch(e){console.error(e);cont.innerHTML="No se pudo cargar el detalle."}
};

function detalleMateria(titulo,preguntas,respuestas){
  let h=`<h3>${titulo}</h3>`;
  preguntas.forEach((p,i)=>{
    const r=Object.prototype.hasOwnProperty.call(respuestas,i)?Number(respuestas[i]):-1;
    const ok=r===Number(p.correcta);
    h+=`<div class="${r<0?'sinrespuesta':ok?'correcta':'incorrecta'}" style="padding:12px;margin:10px 0;border-radius:7px">
      <strong>${i+1}. ${escapar(p.pregunta)}</strong>
      <div style="margin-top:8px">`;
    p.opciones.forEach((op,j)=>{
      let marca="";
      if(j===r) marca=" ← Alumno";
      if(j===Number(p.correcta)) marca+=" ✓ Correcta";
      h+=`<div>${String.fromCharCode(65+j)}. ${escapar(op)} <strong>${marca}</strong></div>`;
    });
    h+=`<p>${r<0?'⚠️ Sin respuesta':ok?'✅ Correcta':'❌ Incorrecta'}</p></div>`;
  });
  return h;
}

function escapar(v){return String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}

</script>
</body>
</html>
